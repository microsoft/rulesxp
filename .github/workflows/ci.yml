name: CI

on:
  push:
    branches: [main, feature/pipeline-test]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-D warnings'
  MSRV: '1.90'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust-version: [msrv, stable]
        cargo-args:
          - '--no-default-features'
          - '--no-default-features --features scheme'
          - '--no-default-features --features jsonlogic'
          - '--no-default-features --features scheme,jsonlogic'
        include:
          - rust-version: stable
            cargo-args: '--no-default-features --features scheme,jsonlogic'
            doc-tests: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Resolve toolchain
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        rust="${{ matrix.rust-version }}"
        [[ "$rust" == "msrv" ]] && rust="$MSRV"
        echo "toolchain=$rust" >> "$GITHUB_OUTPUT"

        if [[ "${{ matrix.rust-version }}" == "stable" ]]; then
          echo "should-run-full-checks=true" >> "$GITHUB_OUTPUT"
        else
          echo "should-run-full-checks=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ steps.resolve.outputs.should-run-full-checks == 'true' && 'clippy' || '' }}

    - name: Run clippy
      if: steps.resolve.outputs.should-run-full-checks == 'true'
      run: cargo clippy --all-targets ${{ matrix.cargo-args }} -- -D warnings

    - name: Run tests
      if: steps.resolve.outputs.should-run-full-checks == 'true'
      run: cargo test --all-targets ${{ matrix.cargo-args }} --verbose

    - name: Check library (MSRV)
      if: steps.resolve.outputs.should-run-full-checks != 'true'
      run: cargo check ${{ matrix.cargo-args }} --verbose

    - name: Run doc tests
      if: matrix.doc-tests
      run: cargo test --doc --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Generate code coverage
      run: |
        cargo llvm-cov --all-features --workspace --html --output-dir coverage-html
        cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --no-run

    - name: Upload coverage HTML
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-html/
        retention-days: 30

    - name: Upload to Codecov
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: '-D warnings'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Build documentation
      run: cargo doc --all-features --no-deps

  fuzz-build:
    # This job ensures the fuzz crate compiles on the nightly toolchain.
    # Actual fuzzing runs on a schedule in fuzz.yml, not here.
    name: Fuzz Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz

    - name: Check fuzz crate compilation
      run: cargo fuzz build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Run security audit
      run: cargo audit

  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly

    - name: Install cargo-hack and cargo-minimal-versions
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack,cargo-minimal-versions

    - name: Check minimal versions
      run: cargo +nightly minimal-versions check --direct --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install typos
      uses: taiki-e/install-action@v2
      with:
        tool: typos-cli

    - name: Run typos
      run: typos

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run actionlint
      uses: raven-actions/actionlint@v2

  ci-success:
    name: CI Success
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, fmt, docs, coverage, fuzz-build, security, minimal-versions, typos, workflow-lint]
    steps:
    - name: Verify all required jobs succeeded
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
      run: |
        echo "One or more required jobs failed, were cancelled, or were skipped."
        exit 1
